name: Update News Digest

on:
  schedule:
    - cron: '*/30 * * * *' # 予備（GitHub側の定期実行は遅延しやすい）
  workflow_dispatch: # cron-job.org からの起動 / 手動実行

# 同時に複数実行されないようにする（後から来た方は待機）
concurrency:
  group: update-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run build script
        run: python build.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add articles.json
          git commit -m "Auto-update news digest [skip ci]" || { echo "No changes to commit"; exit 0; }
          git pull --rebase -X theirs origin main || true
          git push
